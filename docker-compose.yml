services:
  lint:
    image: buildkite/plugin-linter
    command: [ '--id', 'theopenlane/queue-overflow' ]
    volumes:
      - ".:/plugin:ro"
  # The hook shells out to jq, so the tests need a real one; the
  # buildkite-agent and curl calls are stubbed in tests/command.bats.
  tests:
    image: bats/bats:1.11.0
    working_dir: /plugin
    entrypoint: [ "bash", "-c", "apk add --no-cache jq >/dev/null && bats tests/" ]
    volumes:
      - ".:/plugin:ro"
